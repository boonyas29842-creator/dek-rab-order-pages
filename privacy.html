<!DOCTYPE html>

<head><meta charset="UTF-8"><title>นโยบายความเป็นส่วนตัว</title></head>
<body>
<h1>นโยบายความเป็นส่วนตัว</h1>
<p>ระบบนี้เป็นระบบภายในของร้าน ใช้สำหรับรับออเดอร์และส่งใบสั่งจัดของไปยังเครื่องพิมพ์ของร้านเท่านั้น ไม่มีการเก็บหรือแชร์ข้อมูลส่วนบุคคลของบุคคลภายนอก</p>
</body>
</html>
